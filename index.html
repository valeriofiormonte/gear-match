<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GearMatch — Smart Outdoor Kit Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col selection:bg-emerald-100 selection:text-emerald-900">

  <!-- HEADER -->
  <header class="border-b border-slate-200/80 bg-white/80 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white font-bold shadow-sm">🌲</div>
        <span class="text-lg font-bold tracking-tight text-slate-900">GearMatch</span>
      </div>
      <span id="data-status" class="text-xs font-medium px-3 py-1 rounded-full border border-amber-200 bg-amber-50 text-amber-700">
        Inizializzazione Database...
      </span>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-12 flex flex-col items-center">
    
    <!-- PROMPT HERO SECTION -->
    <section class="w-full text-center space-y-6 my-auto max-w-2xl">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">
        Il tuo kit da trekking ideale,<br class="hidden sm:inline"/> trovato dalle tue parole.
      </h1>
      <p class="text-sm sm:text-base text-slate-600">
        Database esterno sincronizzato. Descrivi il tuo viaggio e l'algoritmo abbinerà i prodotti migliori.
      </p>

      <div class="pt-2">
        <div class="bg-white p-2 rounded-2xl border border-slate-200 shadow-xl shadow-slate-200/50 flex flex-col sm:flex-row gap-2 focus-within:border-emerald-500 focus-within:ring-4 focus-within:ring-emerald-500/10 transition-all">
          <div class="flex-1 flex items-center gap-3 px-3">
            <span class="text-slate-400 text-lg">🔍</span>
            <input 
              type="text" 
              id="user-prompt" 
              placeholder="Es: Voglio fare campeggio con la famiglia in comodità..." 
              class="w-full bg-transparent text-slate-900 text-sm focus:outline-none placeholder:text-slate-400 font-medium"
              disabled
            />
          </div>
          <button 
            id="btn-generate"
            onclick="processPrompt()" 
            class="bg-slate-300 text-slate-500 font-semibold text-sm px-6 py-3 rounded-xl transition-all flex items-center justify-center gap-2"
            disabled>
            ⏳ Caricamento...
          </button>
        </div>

        <div class="flex flex-wrap justify-center gap-2 mt-4 text-xs">
          <button onclick="setPrompt('Un trekking ultraleggero per macinare dislivello sulle Alpi')" class="bg-white hover:bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-full shadow-2xs">🪶 Ultralight Alta Quota</button>
          <button onclick="setPrompt('Spedizione in Perù con freddo intenso')" class="bg-white hover:bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-full shadow-2xs">❄️ Spedizione Andina</button>
          <button onclick="setPrompt('Weekend in bikepacking gravel con poco spazio')" class="bg-white hover:bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-full shadow-2xs">🚲 Bikepacking Gravel</button>
        </div>
      </div>
    </section>

    <!-- RISULTATI -->
    <section id="results-section" class="w-full space-y-6 mt-12 hidden transition-all duration-500">
      <div class="border-t border-slate-200 pt-8"></div>
      
      <!-- BANNER STATS -->
      <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
        <div class="space-y-1">
          <span id="scenario-tag" class="text-xs font-semibold uppercase tracking-wider text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-0.5 rounded-md">Profilo</span>
          <h3 id="scenario-title" class="text-xl font-bold text-slate-900">Titolo Scenario</h3>
          <p id="scenario-desc" class="text-sm text-slate-600"></p>
        </div>
        <div class="flex gap-3 w-full md:w-auto">
          <div class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-center min-w-[120px]">
            <span class="text-[11px] font-medium text-slate-500 block">Peso Base</span>
            <span id="stat-weight" class="text-xl font-extrabold text-slate-900">0.0 kg</span>
          </div>
          <div class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-center min-w-[120px]">
            <span class="text-[11px] font-medium text-slate-500 block">Costo Stimato</span>
            <span id="stat-price" class="text-xl font-extrabold text-emerald-600">0 €</span>
          </div>
        </div>
      </div>

      <!-- PRODOTTI -->
      <div>
        <h3 class="text-sm font-semibold text-slate-900 mb-3">📦 Equipaggiamento Consigliato</h3>
        <div id="products-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>
    </section>

  </main>

  <script>
    // =========================================================================
    // INSERISCI QUI I DUE LINK CSV (Scheda Scenari e Scheda Prodotti)
    // =========================================================================
    const URL_CSV_SCENARI = "LINK_CSV_SCHEDA_SCENARI";
    const URL_CSV_PRODOTTI = "LINK_CSV_SCHEDA_PRODOTTI";

    let DB = { scenarios: [], products: [] };

    // =========================================================================
    // 1. FETCH DATI DA GOOGLE FOGLI
    // =========================================================================
    async function initDatabase() {
      if (URL_CSV_SCENARI.includes("LINK_CSV")) {
        updateStatus("Inserisci i link CSV nel codice per iniziare", "red");
        return;
      }

      try {
        // Scarica entrambi i file in parallelo
        const [resScenari, resProdotti] = await Promise.all([
          fetch(URL_CSV_SCENARI), fetch(URL_CSV_PRODOTTI)
        ]);

        const txtScenari = await resScenari.text();
        const txtProdotti = await resProdotti.text();

        // Parsing Scenari
        DB.scenarios = txtScenari.split(/\r?\n/).slice(1).map(line => {
          const v = line.split(',').map(s => s.trim());
          return v.length > 3 ? { id: v[0], name: v[1], desc: v[2], profile: v[3], keywords: v[4] || "" } : null;
        }).filter(Boolean);

        // Parsing Prodotti
        DB.products = txtProdotti.split(/\r?\n/).slice(1).map(line => {
          const v = line.split(',').map(s => s.trim());
          return v.length > 5 ? {
            id: v[0], name: v[1], brand: v[2], category: v[3],
            price: parseFloat(v[4])||0, weight: parseInt(v[5])||0,
            tempComfort: v[6] && v[6]!=='-' ? v[6] : undefined,
            rValue: v[7] && v[7]!=='-' ? v[7] : undefined,
            profile: v[8], url: v[9] || "#"
          } : null;
        }).filter(Boolean);

        updateStatus("Database Live (Connesso a GSheets)", "emerald");
        
        // Abilita la barra di ricerca
        document.getElementById("user-prompt").disabled = false;
        const btn = document.getElementById("btn-generate");
        btn.disabled = false;
        btn.className = "bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm px-6 py-3 rounded-xl transition-all shadow-sm active:scale-[0.98] flex items-center justify-center gap-2";
        btn.innerHTML = "⚡ Genera Kit";

      } catch (error) {
        updateStatus("Errore connessione a Google Fogli", "red");
        console.error(error);
      }
    }

    function updateStatus(msg, color) {
      const el = document.getElementById("data-status");
      el.innerText = msg;
      el.className = `text-xs font-medium px-3 py-1 rounded-full border border-${color}-200 bg-${color}-50 text-${color}-700`;
    }

    // =========================================================================
    // 2. MOTORE DI RICERCA CONVERSAZIONALE NLP
    // =========================================================================
    function setPrompt(text) {
      document.getElementById("user-prompt").value = text;
      processPrompt();
    }

    function processPrompt() {
      const promptText = document.getElementById("user-prompt").value.toLowerCase();
      if (!promptText.trim()) return;

      let bestMatch = DB.scenarios[0];
      let maxScore = 0;

      // Confronta le parole scritte dall'utente con le keywords nel foglio Google
      DB.scenarios.forEach(scen => {
        let score = 0;
        const keywords = scen.keywords.toLowerCase().split(',').map(k => k.trim());
        
        keywords.forEach(kw => {
          if (kw && promptText.includes(kw)) score++;
        });

        if (score > maxScore) {
          maxScore = score;
          bestMatch = scen;
        }
      });

      renderKit(bestMatch);
    }

    // =========================================================================
    // 3. RENDERIZZAZIONE A SCHERMO
    // =========================================================================
    function renderKit(scenario) {
      document.getElementById("results-section").classList.remove("hidden");
      document.getElementById("results-section").scrollIntoView({ behavior: 'smooth', block: 'start' });

      document.getElementById("scenario-title").innerText = scenario.name;
      document.getElementById("scenario-desc").innerText = scenario.desc;
      document.getElementById("scenario-tag").innerText = `Profilo: ${scenario.profile}`;

      const categories = ['Tenda', 'Sacco a Pelo', 'Materassino', 'Zaino', 'Fornelletto'];
      
      const kit = categories.map(cat => {
        const matchingCat = DB.products.filter(p => p.category === cat);
        // Cerca il prodotto col profilo esatto, altrimenti usa un fallback Bilanciato o il primo disponibile
        return matchingCat.find(p => p.profile === scenario.profile) || 
               matchingCat.find(p => p.profile === 'Bilanciato') || 
               matchingCat[0];
      }).filter(Boolean);

      const totalWeight = kit.reduce((acc, p) => acc + p.weight, 0);
      const totalPrice = kit.reduce((acc, p) => acc + p.price, 0);

      document.getElementById("stat-weight").innerText = `${(totalWeight / 1000).toFixed(2)} kg`;
      document.getElementById("stat-price").innerText = `${totalPrice} €`;

      document.getElementById("products-list").innerHTML = kit.map(p => `
        <div class="bg-white border border-slate-200 rounded-xl p-5 flex flex-col justify-between hover:shadow-md hover:border-slate-300 transition-all">
          <div>
            <div class="flex justify-between items-center mb-2">
              <span class="text-[11px] font-bold text-emerald-700 uppercase tracking-wider bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">
                ${p.category}
              </span>
              <span class="text-xs text-slate-500 font-medium">${p.brand}</span>
            </div>
            <h4 class="font-bold text-slate-900 text-sm mb-3">${p.name}</h4>
            <div class="space-y-1 text-xs text-slate-600 mb-4 bg-slate-50 p-2.5 rounded-lg border border-slate-100">
              <div class="flex justify-between"><span>Peso:</span> <strong class="text-slate-900">${p.weight} g</strong></div>
              ${p.tempComfort ? `<div class="flex justify-between"><span>Temp Comfort:</span> <strong class="text-slate-900">${p.tempComfort}°C</strong></div>` : ''}
              ${p.rValue ? `<div class="flex justify-between"><span>Isolamento:</span> <strong class="text-slate-900">R-${p.rValue}</strong></div>` : ''}
            </div>
          </div>
          <div class="pt-3 border-t border-slate-100 flex justify-between items-center mt-auto">
            <span class="text-base font-extrabold text-slate-900">${p.price} €</span>
            <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors">
              Store ↗
            </a>
          </div>
        </div>
      `).join('');
    }

    document.getElementById("user-prompt").addEventListener("keypress", (e) => {
      if (e.key === "Enter" && !e.target.disabled) processPrompt();
    });

    initDatabase();
  </script>
</body>
</html>
